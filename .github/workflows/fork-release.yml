# plorpedaisy fork (thwonp/pokedaisy-lr) only: a plorpedaisy-<version> tag on main drafts a release with
# linux.yml's six Linux files. The fork ships no Android app. Upstream's release.yml only runs on v* tags.
name: Fork release

on:
  push:
    tags: ['plorpedaisy-*']

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="${GITHUB_REF_NAME#plorpedaisy-}"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '${version}'"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::tag isn't on main"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux files
    needs: verify
    uses: ./.github/workflows/linux.yml

  draft:
    name: Draft release
    needs: [verify, checks, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dl
      - name: Draft with the six Linux files
        run: |
          find dl -type f | sort
          files=(dl/pokedaisy-linux-x86_64/*.zip dl/pokedaisy-linux-aarch64/*.zip)
          test "${#files[@]}" -eq 6 || { echo "::error::expected 6 files, got ${#files[@]}"; exit 1; }
          pre=""; [ "${{ needs.verify.outputs.prerelease }}" = true ] && pre="--prerelease"
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft ${pre} --verify-tag \
            --title "PlorpeDaisy ${VERSION}" --notes "Draft: notes to follow." "${files[@]}"
