# plorpedaisy fork (thwonp/pokedaisy-lr) only: a plorpedaisy-<version> tag on main drafts a release with every
# file upstream ships - the signed APK (app id com.pokedaisy.app.plorp, the fork's own key) and linux.yml's six
# Linux files. The tag's version becomes the APK's versionName at build time, so main never carries a version
# bump of its own. Upstream's release.yml only runs on v* tags. Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD; variable RELEASE_CERT_SHA256.
name: Fork release

on:
  push:
    tags: ['plorpedaisy-*']

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="${GITHUB_REF_NAME#plorpedaisy-}"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '${version}'"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::tag isn't on main"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux files
    needs: verify
    uses: ./.github/workflows/linux.yml

  apk:
    name: Signed APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: NDK + CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Signing key (from secrets, never committed); versionName from the tag
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::secret ${v} isn't set"; exit 1; }
          done
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${RUNNER_TEMP}/release.jks" "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" > keystore.properties
          sed -i "s/^\( *versionName = \)\".*\"/\1\"${VERSION}\"/" app/build.gradle.kts
          grep -n 'versionName = ' app/build.gradle.kts
      - name: Release APK (arm64 and 32-bit ARM)
        run: ./gradlew :app:assembleRelease -Ppokedaisy.armv7=true --stacktrace
      - name: Signed with the fork key, both ABIs inside
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("${apksigner}" verify --print-certs "${apk}")"
          echo "${certs}"
          want="$(echo "${RELEASE_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "${want}" && echo "${certs}" | grep -qi "SHA-256 digest: ${want}" || { echo "::error::APK isn't signed with the fork key"; exit 1; }
          files="$(unzip -Z1 "${apk}")"
          for abi in arm64-v8a armeabi-v7a; do
            grep -qx "lib/${abi}/libpokedaisy.so" <<< "${files}" || { echo "::error::APK has no lib/${abi}/libpokedaisy.so"; exit 1; }
          done
          mkdir -p dist && cp "${apk}" "dist/PlorpeDaisy-${VERSION}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plorpedaisy-apk
          path: dist/*.apk

  draft:
    name: Draft release
    needs: [verify, checks, linux, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dl
      - name: Draft with the APK and the six Linux files
        run: |
          find dl -type f | sort
          files=(dl/plorpedaisy-apk/*.apk dl/pokedaisy-linux-x86_64/*.zip dl/pokedaisy-linux-aarch64/*.zip)
          test "${#files[@]}" -eq 7 || { echo "::error::expected 7 files, got ${#files[@]}"; exit 1; }
          pre=""; [ "${{ needs.verify.outputs.prerelease }}" = true ] && pre="--prerelease"
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft ${pre} --verify-tag \
            --title "PlorpeDaisy ${VERSION}" --notes "Draft: notes to follow." "${files[@]}"
